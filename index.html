<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clover Themes</title>
    <!-- JSZip Library for local zip creation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        /* Copyright © 2026 chris1111 , All Rights Reserved. */
        :root {
            --bg-color: #130f1c;
            --card-bg: #1c1729;
            --border-color: #312a44;
            --text-primary: #f0f0f5;
            --text-secondary: #a39db8;
            --accent-purple: #a371f7;
            --accent-green: #238636;
            --accent-green-hover: #2ea043;
            --hover-bg: #251d36;
            --error-color: #f85149;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0a0813;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #galaxy-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
            background: radial-gradient(ellipse at bottom, #241b35 0%, #09070f 100%);
        }

        .container {
            background-color: rgba(28, 23, 41, 0.88);
            backdrop-filter: blur(6px);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            max-width: 1400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .logo {
            width: 90px; height: 90px;
            margin-bottom: 20px;
            border-radius: 18px;
            border: 1px solid var(--border-color);
            filter: drop-shadow(0 0 8px #2ea043) drop-shadow(0 0 20px rgba(46, 160, 67, 0.6));
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            0%   { filter: drop-shadow(0 0 5px #2ea043) drop-shadow(0 0 15px rgba(46, 160, 67, 0.4)); }
            100% { filter: drop-shadow(0 0 12px #2ea043) drop-shadow(0 0 30px rgba(46, 160, 67, 0.8)); }
        }

        h1 { font-size: 24px; margin-bottom: 10px; font-weight: 600; }
        p  { color: var(--text-secondary); margin-bottom: 30px; font-size: 14px; line-height: 1.5; }

        #folder-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            text-align: left;
            width: 100%;
        }
        @media (min-width: 600px)  { #folder-list { grid-template-columns: 1fr 1fr; } }
        @media (min-width: 900px)  { #folder-list { grid-template-columns: 1fr 1fr 1fr; } }
        @media (min-width: 1200px) { #folder-list { grid-template-columns: 1fr 1fr 1fr 1fr; } }

        .folder-item {
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            transition: border-color 0.2s, background-color 0.2s, transform 0.2s, box-shadow 0.2s;
        }
        .folder-item:hover {
            border-color: var(--accent-purple);
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(163, 113, 247, 0.15);
        }

        .screenshot-container {
            width: 100%;
            height: 140px;
            background-color: #0d0a13;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }
        .screenshot-img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
            opacity: 0;
        }
        .folder-item:hover .screenshot-img { transform: scale(1.03); }

        .screenshot-placeholder {
            position: absolute;
            inset: 0;
            background-color: #0d0a13;
            color: var(--text-secondary);
            font-size: 13px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-align: center;
            padding: 10px;
            z-index: 2;
        }

        .card-body {
            padding: 12px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            flex-grow: 1;
            background-color: var(--bg-color);
            text-align: center;
        }
        .folder-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }
        .folder-icon { color: var(--accent-purple); font-size: 18px; }
        .folder-name {
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-primary);
            max-width: 90%;
        }
        .actions { display: flex; gap: 8px; width: 100%; }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 8px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            flex-grow: 1;
            border: 1px solid transparent;
        }
        .btn-view { background-color: transparent; color: var(--text-primary); border-color: var(--border-color); }
        .btn-view:hover { background-color: var(--hover-bg); border-color: var(--accent-purple); }
        .btn-download {
            background-color: var(--accent-green);
            color: #ffffff;
            border: 1px solid rgba(240, 246, 252, 0.1);
        }
        .btn-download:hover:not(:disabled) { background-color: var(--accent-green-hover); }
        .btn-download:disabled { cursor: wait; opacity: 0.7; }

        .spinner {
            width: 24px; height: 24px;
            border: 3px solid rgba(163, 113, 247, 0.2);
            border-radius: 50%;
            border-top-color: var(--accent-purple);
            animation: spin 1s ease-in-out infinite;
            margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #status {
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .error { color: var(--error-color); }

        /* BACK TO TOP BUTTON */
        #back-to-top {
            position: fixed;
            bottom: 30px; right: 30px;
            width: 52px; height: 52px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            border: 1px solid rgba(240, 246, 252, 0.15);
            background: radial-gradient(circle at 30% 30%, #2ea043 0%, #238636 60%, #1a6b29 100%);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5), 0 0 0 0 rgba(46, 160, 67, 0.5);
            opacity: 0; visibility: hidden;
            transform: translateY(20px) scale(0.8);
            transition: opacity 0.35s ease, transform 0.35s ease, box-shadow 0.3s ease, background 0.3s ease;
            z-index: 9999;
            animation: bttPulse 2.6s infinite alternate;
        }
        #back-to-top.show { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }
        #back-to-top:hover {
            background: radial-gradient(circle at 30% 30%, #46c75d 0%, #2ea043 60%, #238636 100%);
            box-shadow: 0 6px 22px rgba(0,0,0,0.6), 0 0 18px rgba(46,160,67,0.85), 0 0 36px rgba(46,160,67,0.45);
            transform: translateY(-3px) scale(1.05);
        }
        #back-to-top:active { transform: translateY(0) scale(0.96); }
        #back-to-top svg { width: 24px; height: 24px; fill: #ffffff; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.4)); transition: transform 0.3s ease; }
        #back-to-top:hover svg { transform: translateY(-2px); }
        @keyframes bttPulse {
            0%   { box-shadow: 0 4px 14px rgba(0,0,0,0.5), 0 0 0 0   rgba(46,160,67,0.45); }
            100% { box-shadow: 0 4px 14px rgba(0,0,0,0.5), 0 0 0 12px rgba(46,160,67,0);   }
        }
        @media (max-width: 480px) {
            #back-to-top { bottom: 20px; right: 20px; width: 46px; height: 46px; }
            #back-to-top svg { width: 20px; height: 20px; }
        }
    </style>
</head>
<body>

    <canvas id="galaxy-bg"></canvas>

<div class="container">
    <img src="https://raw.githubusercontent.com/CloverHackyColor/CloverBootloader/master/Logo/Clover-Logo-Default-256x256@1x.png" alt="Clover Logo" class="logo">
    
    <h1>Clover Themes Gallery</h1>
    <p>Browse all themes from the <strong style="color: var(--text-primary);">CloverHackyColor/CloverThemes</strong> repository.</p>
    <p>Click "Download" to save a ZIP of the theme.</p>
    
    <div id="status">
        <div class="spinner"></div>
        Fetching folders...
    </div>
    <div id="folder-list"></div>
</div>

<!-- BACK TO TOP BUTTON -->
<div id="back-to-top" role="button" aria-label="Back to top" title="Back to top" tabindex="0">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M12 4.5L4.5 12.2c-.4.4-.4 1 0 1.4.4.4 1 .4 1.4 0L11 8.6V19c0 .6.4 1 1 1s1-.4 1-1V8.6l5.1 5.1c.4.4 1 .4 1.4 0 .4-.4.4-1 0-1.4L12 4.5z"/>
    </svg>
</div>

<script>
    // ==========================================
    // 1. GALAXY BACKGROUND ANIMATION
    // ==========================================
    const canvas = document.getElementById('galaxy-bg');
    const ctx = canvas.getContext('2d');
    let stars = [];
    let w, h;

    function initStars() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        stars = [];
        const numStars = Math.floor((w * h) / 4000);
        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * w,
                y: Math.random() * h,
                radius: Math.random() * 1.2 + 0.2,
                speedX: (Math.random() - 0.5) * 0.15,
                speedY: (Math.random() - 0.5) * 0.15,
                opacity: Math.random() * 0.8 + 0.2,
                twinkleSpeed: Math.random() * 0.02 + 0.005,
                twinklePos: Math.random() * Math.PI * 2,
                color: Math.random() > 0.8 ? '#a371f7' : (Math.random() > 0.8 ? '#d2a8ff' : '#ffffff')
            });
        }
    }

    function drawGalaxy() {
        ctx.clearRect(0, 0, w, h);
        stars.forEach(star => {
            star.x += star.speedX;
            star.y += star.speedY;
            star.twinklePos += star.twinkleSpeed;
            if (star.x < 0) star.x = w;
            if (star.x > w) star.x = 0;
            if (star.y < 0) star.y = h;
            if (star.y > h) star.y = 0;
            const currentOpacity = star.opacity * (Math.sin(star.twinklePos) * 0.5 + 0.5);
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
            if (star.color.startsWith('#')) {
                const hex = star.color.slice(1);
                const r = parseInt(hex.slice(0, 2), 16);
                const g = parseInt(hex.slice(2, 4), 16);
                const b = parseInt(hex.slice(4, 6), 16);
                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${currentOpacity})`;
            }
            ctx.fill();
        });
        requestAnimationFrame(drawGalaxy);
    }

    window.addEventListener('resize', initStars);
    initStars();
    drawGalaxy();

    // ==========================================
    // 2. GITHUB THEMES FETCHING LOGIC
    // ==========================================
    const repoOwner = "CloverHackyColor";
    const repoName = "CloverThemes";
    const branchName = "master";
    
    const statusDiv = document.getElementById("status");
    const listDiv = document.getElementById("folder-list");
    
    // Store all file lists for each theme so we can zip them locally later
    const themeFilesMap = {};

    function createFolderRow(folderName, folderUrl, imgUrl, files) {
        const itemDiv = document.createElement("div");
        itemDiv.className = "folder-item";
        
        let previewHtml = '';
        if (imgUrl) {
            previewHtml = `
                <div class="screenshot-container">
                    <div class="screenshot-placeholder">Loading preview...</div>
                    <img alt="${folderName}" class="screenshot-img">
                </div>
            `;
        } else {
            previewHtml = `
                <div class="screenshot-container">
                    <div class="screenshot-placeholder">No preview available</div>
                </div>
            `;
        }
        
        itemDiv.innerHTML = `
            ${previewHtml}
            <div class="card-body">
                <div class="folder-info">
                    <span class="folder-icon">&#128193;</span>
                    <span class="folder-name">${folderName}</span>
                </div>
                <div class="actions">
                    <a href="${folderUrl}" target="_blank" class="btn btn-view">View</a>
                    <button class="btn btn-download" data-folder="${folderName}">Download</button>
                </div>
            </div>
        `;
        
        if (imgUrl) {
            const imgElement = itemDiv.querySelector('.screenshot-img');
            const placeholderElement = itemDiv.querySelector('.screenshot-placeholder');
            imgElement.onload = function() {
                this.style.opacity = '1';
                placeholderElement.style.display = 'none';
            };
            imgElement.onerror = function() {
                placeholderElement.innerHTML = 'No preview available';
                this.style.display = 'none';
            };
            imgElement.src = imgUrl;
        }
        listDiv.appendChild(itemDiv);
    }

    async function fetchFolders() {
        try {
            const treeUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/git/trees/${branchName}?recursive=1`;
            const response = await fetch(treeUrl);
            if (response.status === 403) throw new Error("GitHub API rate limit exceeded.");
            if (!response.ok) throw new Error(`GitHub API Error: ${response.status}`);
            const data = await response.json();
            
            const foldersMap = new Map();
            
            data.tree.forEach(item => {
                const parts = item.path.split('/');
                
                // Check if it's a root folder or a file inside a root folder (or deeper)
                if (parts.length === 1 && item.type === 'tree') {
                    if (!foldersMap.has(parts[0])) foldersMap.set(parts[0], { imgUrl: null, files: [] });
                } else if (parts.length > 1 && item.type === 'blob') {
                    const folderName = parts[0];
                    if (!foldersMap.has(folderName)) foldersMap.set(folderName, { imgUrl: null, files: [] });
                    
                    // Save file path to the folder's file list for local zipping
                    foldersMap.get(folderName).files.push(item);

                    // Image preview logic (only for files directly in the root folder)
                    if (parts.length === 2 && /\.(png|jpg|jpeg|gif|svg|webp)$/i.test(parts[1])) {
                        const fileName = parts[1];
                        const currentImg = foldersMap.get(folderName).imgUrl;
                        if (!currentImg || /screenshot|preview|theme/i.test(fileName)) {
                            const encodedFolderName = encodeURIComponent(folderName);
                            const encodedFileName = encodeURIComponent(fileName);
                            const imgUrl = `https://raw.githubusercontent.com/${repoOwner}/${repoName}/${branchName}/${encodedFolderName}/${encodedFileName}`;
                            foldersMap.get(folderName).imgUrl = imgUrl;
                        }
                    }
                }
            });
            
            statusDiv.innerHTML = "";
            if (foldersMap.size === 0) {
                statusDiv.innerHTML = "No folders found in the root directory.";
                return;
            }

            const sortedFolders = Array.from(foldersMap.keys()).sort((a, b) => a.localeCompare(b));

            sortedFolders.forEach(folderName => {
                const folderData = foldersMap.get(folderName);
                const folderUrl = `https://github.com/${repoOwner}/${repoName}/tree/${branchName}/${folderName}`;
                // Save to global map for the click event listener
                themeFilesMap[folderName] = folderData.files;
                createFolderRow(folderName, folderUrl, folderData.imgUrl, folderData.files);
            });

        } catch (error) {
            console.error(error);
            statusDiv.className = "error";
            statusDiv.innerHTML = `
                <p>⚠️ ${error.message}</p>
                <p style="font-weight: 400; font-size: 13px; color: var(--text-secondary);">Please manually add themes or try again later.</p>
            `;
            const manualDiv = document.createElement("div");
            manualDiv.className = "folder-item";
            manualDiv.innerHTML = `
                <div class="card-body" style="justify-content: center; padding: 20px;">
                    <div class="folder-info">
                        <span class="folder-icon">&#128269;</span>
                        <span class="folder-name">Browse all folders manually</span>
                    </div>
                    <div class="actions">
                        <a href="https://github.com/CloverHackyColor/CloverThemes" target="_blank" class="btn btn-view">Open GitHub</a>
                    </div>
                </div>
            `;
            listDiv.appendChild(manualDiv);
        }
    }

    // ==========================================
    // 3. LOCAL ZIP GENERATION (JSZip)
    // ==========================================
    async function downloadThemeZip(folderName, btn) {
        const files = themeFilesMap[folderName];
        if (!files || files.length === 0) return;

        const originalText = btn.innerText;
        btn.innerText = "Zipping...";
        btn.disabled = true;

        try {
            const zip = new JSZip();
            // Create a folder inside the zip so it extracts nicely
            const themeFolder = zip.folder(folderName);

            // Fetch all files concurrently
            const fetchPromises = files.map(file => {
                const fileUrl = `https://raw.githubusercontent.com/${repoOwner}/${repoName}/${branchName}/${file.path}`;
                return fetch(fileUrl)
                    .then(res => {
                        if (!res.ok) throw new Error(`Failed to fetch ${file.path}`);
                        return res.blob();
                    })
                    .then(blob => {
                        // Remove the "ThemeName/" part from the path for the inside of the zip
                        const relativePath = file.path.substring(folderName.length + 1);
                        themeFolder.file(relativePath, blob);
                    });
            });

            await Promise.all(fetchPromises);

            // Generate the zip file as a Blob
            const content = await zip.generateAsync({ type: "blob" });
            
            // Create a download link and click it programmatically
            const url = URL.createObjectURL(content);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${folderName}.zip`; // EXACTLY Atomic.zip
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

        } catch (error) {
            console.error("Zip error:", error);
            alert("Failed to create zip. You might be rate-limited by GitHub. Please wait a minute and try again.");
        } finally {
            btn.innerText = originalText;
            btn.disabled = false;
        }
    }

    // Event listener for all download buttons
    listDiv.addEventListener('click', function(e) {
        if (e.target && e.target.classList.contains('btn-download')) {
            const folderName = e.target.getAttribute('data-folder');
            downloadThemeZip(folderName, e.target);
        }
    });

    fetchFolders();

    // ==========================================
    // 4. BACK TO TOP BEHAVIOR
    // ==========================================
    const backToTopBtn = document.getElementById('back-to-top');

    function toggleBackToTop() {
        if (window.scrollY > 300) {
            backToTopBtn.classList.add('show');
        } else {
            backToTopBtn.classList.remove('show');
        }
    }

    window.addEventListener('scroll', toggleBackToTop, { passive: true });
    window.addEventListener('resize', toggleBackToTop);
    toggleBackToTop();

    function scrollToTop() {
        const startY = window.scrollY;
        const duration = 600;
        const startTime = performance.now();

        function easeOutCubic(t) {
            return 1 - Math.pow(1 - t, 3);
        }

        function step(now) {
            const elapsed = now - startTime;
            const t = Math.min(elapsed / duration, 1);
            const eased = easeOutCubic(t);
            window.scrollTo(0, startY * (1 - eased));
            if (t < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
    }

    backToTopBtn.addEventListener('click', scrollToTop);
    backToTopBtn.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            scrollToTop();
        }
    });
</script>

</body>
</html>
